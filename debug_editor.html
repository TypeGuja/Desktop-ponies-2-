<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pony Editor</title>
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-primary: #1e1e2e;
    --bg-secondary: #181825;
    --bg-tertiary: #11111b;
    --text-primary: #cdd6f4;
    --text-secondary: #a6adc8;
    --text-muted: #6c7086;
    --border: #313244;
    --accent: #cba6f7;
    --accent-hover: #b4befe;
    --success: #a6e3a1;
    --warning: #f9e2af;
    --danger: #f38ba8;
    --info: #89b4fa;
    --sidebar-width: 280px;
    --header-height: 52px;
    --footer-height: 36px;
}

body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
}</style><style>.editor-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.editor-header {
    height: var(--header-height);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.editor-header h1 {
    font-size: 18px;
    font-weight: 600;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.editor-main {
    display: flex;
    flex: 1;
    overflow: hidden;
}

.editor-sidebar {
    width: var(--sidebar-width);
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-header {
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

.editor-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.editor-panel {
    max-width: 900px;
    margin: 0 auto;
}

.editor-footer {
    height: var(--footer-height);
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 12px;
    color: var(--text-muted);
}</style><style>.btn-primary {
    padding: 8px 16px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: var(--bg-primary);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-primary:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-secondary {
    padding: 6px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
}

.btn-secondary:hover {
    background: var(--border);
    color: var(--text-primary);
}

.btn-icon {
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
}

.btn-icon:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--accent);
}

.form-row {
    display: flex;
    gap: 12px;
}

.form-row .form-group {
    flex: 1;
}

.card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

.card-header h3 {
    font-size: 16px;
    font-weight: 600;
}

.search-input {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
}

.pony-list {
    flex: 1;
    overflow-y: auto;
}

.pony-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    margin: 4px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.pony-item:hover {
    background: var(--bg-tertiary);
}

.pony-item.selected {
    background: var(--accent);
    color: var(--bg-primary);
}

.pony-name {
    font-weight: 500;
}

.pony-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.pony-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 40px;
}</style><style>.editor-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.tab-btn {
    padding: 10px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
}

.tab-btn:hover {
    color: var(--text-primary);
}

.tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}

.tab-pane {
    display: none;
}

.tab-pane.active {
    display: block;
}

.preview-area {
    display: flex;
    justify-content: center;
    padding: 16px;
}

.loading {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
}

.behavior-card {
    margin-bottom: 16px;
}

.behavior-card .card-header {
    background: var(--bg-tertiary);
    margin: -20px -20px 16px -20px;
    padding: 12px 20px;
    border-radius: 12px 12px 0 0;
}</style>
</head>
<body>
<div class="editor-container">
    <header class="editor-header">
        <h1>🦄 Pony Editor</h1>
        <div class="header-actions">
            <button id="btn-save" class="btn-primary">💾 Save</button>
            <button id="btn-close" class="btn-icon">✕</button>
        </div>
    </header>

    <div class="editor-main">
        <aside class="editor-sidebar">
            <div class="sidebar-header">
                <input type="text" id="search-pony" placeholder="Search pony..." class="search-input">
            </div>
            <div id="pony-list" class="pony-list">
                <div class="loading">Loading ponies...</div>
            </div>
        </aside>

        <main class="editor-content">
            <div id="editor-panel" class="editor-panel">
                <div class="empty-state">
                    <p>✨ Select a pony from the list to edit</p>
                </div>
            </div>
        </main>
    </div>

    <footer class="editor-footer">
        <span id="status-text">Ready</span>
        <span id="pony-count">0 ponies loaded</span>
    </footer>
</div>

    <script>
    // Регистрируем WebView для получения сообщений
    window.__editorReady = true;
    console.log('[Editor] WebView ready, looking for ipc...');

    // Пробуем разные способы получения IPC
    if (typeof window.external !== 'undefined' && window.external) {
        window.ipc = window.external;
        console.log('[Editor] IPC via external');
    }

    // Сообщаем Rust, что мы готовы
    setTimeout(() => {
        if (window.ipc && window.ipc.postMessage) {
            window.ipc.postMessage('editor:ready');
        } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ipc) {
            window.webkit.messageHandlers.ipc.postMessage('editor:ready');
        }
    }, 100);
    </script>
    <script>function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

function showStatus(message, isError = false) {
    const statusEl = document.getElementById('status-text');
    if (statusEl) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? 'var(--danger)' : '';
        setTimeout(() => {
            if (statusEl.textContent === message) {
                statusEl.style.color = '';
            }
        }, 3000);
    }
    console.log('[Editor] ' + message);
}</script><script>// IPC коммуникация с Rust
const EditorAPI = {
    send: function(message) {
        console.log('[Editor] Sending IPC:', message);
        try {
            if (window.ipc && window.ipc.postMessage) {
                window.ipc.postMessage(message);
                return true;
            }
        } catch(e) {
            console.warn('IPC via window.ipc failed:', e);
        }
        try {
            if (window.webkit?.messageHandlers?.ipc) {
                window.webkit.messageHandlers.ipc.postMessage(message);
                return true;
            }
        } catch(e) {
            console.warn('IPC via webkit failed:', e);
        }
        try {
            if (window.external && typeof window.external.sendMessage === 'function') {
                window.external.sendMessage(message);
                return true;
            }
        } catch(e) {}

        console.warn('[Editor] No IPC handler found, message not sent:', message);
        return false;
    },

    loadPonies: function() {
        this.send('editor:load_ponies');
    },

    loadPony: function(name) {
        this.send('editor:load_pony:' + name);
    },

    savePony: function(config) {
        this.send('editor:save_pony:' + JSON.stringify(config));
    }
};</script><script>// Управление состоянием редактора
const EditorState = {
    currentPony: null,
    originalConfig: null,
    modified: false,
    allPonies: [],
    currentTab: 'basic',

    setPony(pony, config) {
        this.currentPony = pony;
        this.originalConfig = JSON.parse(JSON.stringify(config));
        this.modified = false;
        this.updateModifiedStatus();
    },

    markModified() {
        this.modified = true;
        this.updateModifiedStatus();
    },

    updateModifiedStatus() {
        const saveBtn = document.getElementById('btn-save');
        if (saveBtn) {
            saveBtn.disabled = !this.modified;
        }
        const title = document.querySelector('.editor-header h1');
        if (title && this.currentPony) {
            title.innerHTML = this.modified ? `🦄 ✏️ ${this.currentPony}` : `🦄 ${this.currentPony}`;
        }
    },

    hasChanges() {
        return this.modified;
    },

    getConfig() {
        return this.originalConfig;
    }
};</script><script>// Список пони и навигация
const PonyList = {
    container: null,
    searchInput: null,
    currentSelected: null,

    init() {
        this.container = document.getElementById('pony-list');
        this.searchInput = document.getElementById('search-pony');

        if (this.searchInput) {
            this.searchInput.addEventListener('input', debounce(() => this.render(), 300));
        }
    },

    render() {
        if (!this.container) return;

        const searchTerm = this.searchInput?.value.toLowerCase() || '';
        const filtered = EditorState.allPonies.filter(p =>
            p.toLowerCase().includes(searchTerm)
        );

        if (filtered.length === 0) {
            this.container.innerHTML = '<div class="empty-state">No ponies found</div>';
            return;
        }

        this.container.innerHTML = filtered.map(name => `
            <div class="pony-item ${this.currentSelected === name ? 'selected' : ''}" 
                 data-name="${escapeHtml(name)}">
                <div class="pony-info">
                    <div class="pony-icon">🦄</div>
                    <div class="pony-name">${escapeHtml(name)}</div>
                </div>
                <div class="pony-actions">
                    <button class="edit-btn" data-name="${escapeHtml(name)}">✏️</button>
                </div>
            </div>
        `).join('');

        // Привязываем события
        this.container.querySelectorAll('.pony-item').forEach(item => {
            item.addEventListener('click', (e) => {
                if (!e.target.closest('.edit-btn')) {
                    const name = item.dataset.name;
                    this.selectPony(name);
                }
            });

            const editBtn = item.querySelector('.edit-btn');
            if (editBtn) {
                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.selectPony(editBtn.dataset.name);
                });
            }
        });
    },

    selectPony(name) {
        if (EditorState.hasChanges()) {
            if (!confirm('You have unsaved changes. Load another pony anyway?')) {
                return;
            }
        }
        this.currentSelected = name;
        this.render();
        showStatus(`Loading ${name}...`);
        EditorAPI.loadPony(name);
    },

    updateList(ponies) {
        EditorState.allPonies = ponies || [];
        const countEl = document.getElementById('pony-count');
        if (countEl) {
            countEl.textContent = `${EditorState.allPonies.length} ponies loaded`;
        }
        this.render();
    }
};</script><script>// Основной редактор параметров пони
const PonyEditor = {
    container: null,

    init() {
        this.container = document.getElementById('editor-panel');
    },

    render(config) {
        if (!this.container) return;

        if (!config) {
            this.container.innerHTML = '<div class="empty-state"><p>✨ Select a pony from the list to edit</p></div>';
            return;
        }

        const html = `
            <div class="editor-tabs">
                <button class="tab-btn active" data-tab="basic">📝 Basic</button>
                <button class="tab-btn" data-tab="behaviors">🏃 Behaviors (${config.behaviors?.length || 0})</button>
                <button class="tab-btn" data-tab="speeches">💬 Speeches (${config.speaks?.length || 0})</button>
                <button class="tab-btn" data-tab="effects">✨ Effects (${config.effects?.length || 0})</button>
                <button class="tab-btn" data-tab="interactions">🤝 Interactions (${config.interactions?.length || 0})</button>
            </div>
            
            <div id="tab-basic" class="tab-pane active">
                ${this.renderBasicTab(config)}
            </div>
            <div id="tab-behaviors" class="tab-pane">
                ${BehaviorEditor.render(config.behaviors || [])}
            </div>
            <div id="tab-speeches" class="tab-pane">
                ${SpeechEditor.render(config.speaks || [])}
            </div>
            <div id="tab-effects" class="tab-pane">
                ${EffectEditor.render(config.effects || [])}
            </div>
            <div id="tab-interactions" class="tab-pane">
                ${InteractionEditor.render(config.interactions || [])}
            </div>
        `;

        this.container.innerHTML = html;

        // Привязываем события табов
        this.container.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => this.switchTab(btn.dataset.tab));
        });

        // Привязываем события форм
        this.bindEvents(config);

        // Привязываем события для редакторов
        BehaviorEditor.bindEvents(this.container);
        SpeechEditor.bindEvents(this.container);
        EffectEditor.bindEvents(this.container);
        InteractionEditor.bindEvents(this.container);
    },

    renderBasicTab(config) {
        return `
            <div class="card">
                <div class="card-header">
                    <h3>General Information</h3>
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="display-name" value="${escapeHtml(config.name || '')}" 
                           placeholder="Pony display name">
                </div>
                <div class="form-group">
                    <label>Categories (comma separated)</label>
                    <input type="text" id="categories" value="${escapeHtml((config.categories || []).join(', '))}" 
                           placeholder="Main Ponies, Mares, Unicorns">
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Colors (visual selection)</h3>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Body Color</label>
                        <input type="color" id="body-color" value="#d4a574">
                    </div>
                    <div class="form-group">
                        <label>Mane Color</label>
                        <input type="color" id="mane-color" value="#8b4513">
                    </div>
                    <div class="form-group">
                        <label>Eye Color</label>
                        <input type="color" id="eye-color" value="#4a90d9">
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Preview</h3>
                </div>
                <div class="preview-area">
                    <canvas id="pony-preview" width="200" height="200" 
                            style="background: var(--bg-tertiary); border-radius: 12px;"></canvas>
                </div>
            </div>
        `;
    },

    bindEvents(config) {
        // Basic info
        const displayName = document.getElementById('display-name');
        const categories = document.getElementById('categories');

        const saveField = (field, value) => {
            config[field] = value;
            EditorState.markModified();
        };

        if (displayName) {
            displayName.addEventListener('change', () => saveField('name', displayName.value));
        }
        if (categories) {
            categories.addEventListener('change', () => {
                config.categories = categories.value.split(',').map(c => c.trim()).filter(c => c);
                EditorState.markModified();
            });
        }

        // Color preview
        const bodyColor = document.getElementById('body-color');
        const maneColor = document.getElementById('mane-color');
        const eyeColor = document.getElementById('eye-color');
        const canvas = document.getElementById('pony-preview');

        const drawPreview = () => {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // Простой SVG-подобный рендер пони
            ctx.fillStyle = bodyColor?.value || '#d4a574';
            ctx.beginPath();
            ctx.ellipse(w/2, h/2 + 20, 50, 35, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = bodyColor?.value || '#d4a574';
            ctx.beginPath();
            ctx.ellipse(w/2, h/2 - 20, 30, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            // Грива
            ctx.fillStyle = maneColor?.value || '#8b4513';
            ctx.beginPath();
            ctx.ellipse(w/2 - 20, h/2 - 25, 15, 20, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(w/2 + 20, h/2 - 25, 15, 20, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Глаза
            ctx.fillStyle = eyeColor?.value || '#4a90d9';
            ctx.beginPath();
            ctx.arc(w/2 - 12, h/2 - 28, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(w/2 + 12, h/2 - 28, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(w/2 - 14, h/2 - 30, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(w/2 + 10, h/2 - 30, 2, 0, Math.PI * 2);
            ctx.fill();
        };

        if (bodyColor) bodyColor.addEventListener('input', drawPreview);
        if (maneColor) maneColor.addEventListener('input', drawPreview);
        if (eyeColor) eyeColor.addEventListener('input', drawPreview);
        drawPreview();
    },

    switchTab(tabName) {
        document.querySelectorAll('.tab-pane').forEach(pane => {
            pane.classList.remove('active');
        });
        const targetPane = document.getElementById(`tab-${tabName}`);
        if (targetPane) targetPane.classList.add('active');

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.tab === tabName) {
                btn.classList.add('active');
            }
        });
    }
};</script><script>// Редактор поведений
const BehaviorEditor = {
    behaviors: [],

    render(behaviors) {
        this.behaviors = behaviors || [];

        if (this.behaviors.length === 0) {
            return `
                <div class="card">
                    <div class="empty-state">No behaviors defined</div>
                    <button class="btn-secondary" id="add-behavior">+ Add Behavior</button>
                </div>
            `;
        }

        let html = `
            <div style="margin-bottom: 16px;">
                <button class="btn-secondary" id="add-behavior">+ Add Behavior</button>
            </div>
        `;

        this.behaviors.forEach((behavior, index) => {
            html += `
                <div class="card behavior-card" data-index="${index}">
                    <div class="card-header">
                        <h3>${escapeHtml(behavior.name || 'Unnamed')}</h3>
                        <button class="btn-icon delete-behavior" data-index="${index}">🗑️</button>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" class="behavior-name" value="${escapeHtml(behavior.name)}" data-index="${index}">
                        </div>
                        <div class="form-group">
                            <label>Chance (0-1)</label>
                            <input type="number" step="0.01" min="0" max="1" class="behavior-chance" 
                                   value="${behavior.probability || 0}" data-index="${index}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Min Duration (sec)</label>
                            <input type="number" step="0.5" class="behavior-min-duration" 
                                   value="${behavior.min_duration || 5}" data-index="${index}">
                        </div>
                        <div class="form-group">
                            <label>Max Duration (sec)</label>
                            <input type="number" step="0.5" class="behavior-max-duration" 
                                   value="${behavior.max_duration || 15}" data-index="${index}">
                        </div>
                        <div class="form-group">
                            <label>Speed</label>
                            <input type="number" step="0.5" class="behavior-speed" 
                                   value="${behavior.speed || 3}" data-index="${index}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Right Sprite</label>
                            <input type="text" class="behavior-sprite-right" 
                                   value="${escapeHtml(behavior.sprite_right || '')}" data-index="${index}"
                                   placeholder="filename_right.gif">
                        </div>
                        <div class="form-group">
                            <label>Left Sprite</label>
                            <input type="text" class="behavior-sprite-left" 
                                   value="${escapeHtml(behavior.sprite_left || '')}" data-index="${index}"
                                   placeholder="filename_left.gif">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Movement Type</label>
                            <select class="behavior-movement" data-index="${index}">
                                ${this.renderMovementOptions(behavior.movement)}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Group</label>
                            <input type="number" class="behavior-group" 
                                   value="${behavior.group || 0}" data-index="${index}">
                        </div>
                        <div class="form-group">
                            <label>Skip (random selection)</label>
                            <input type="checkbox" class="behavior-skip" 
                                   ${behavior.skip ? 'checked' : ''} data-index="${index}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Linked Behavior</label>
                        <input type="text" class="behavior-linked" 
                               value="${escapeHtml(behavior.linked_behavior || '')}" data-index="${index}"
                               placeholder="next_behavior_name">
                    </div>
                </div>
            `;
        });

        return html;
    },

    renderMovementOptions(current) {
        const movements = ['None', 'All', 'Horizontal_Only', 'Vertical_Only', 'Diagonal_Only', 'Sleep', 'Dragged', 'MouseOver'];
        return movements.map(m => `<option value="${m}" ${current === m ? 'selected' : ''}>${m}</option>`).join('');
    },

    bindEvents(container) {
        if (!container) return;

        // Добавление поведения
        const addBtn = container.querySelector('#add-behavior');
        if (addBtn) {
            addBtn.addEventListener('click', () => {
                this.behaviors.push({
                    name: 'New Behavior',
                    probability: 0.1,
                    min_duration: 5,
                    max_duration: 15,
                    speed: 3,
                    sprite_right: '',
                    sprite_left: '',
                    movement: 'All',
                    linked_behavior: '',
                    skip: false,
                    group: 0
                });
                EditorState.markModified();
                PonyEditor.render(EditorState.getConfig());
            });
        }

        // Удаление поведения
        container.querySelectorAll('.delete-behavior').forEach(btn => {
            btn.addEventListener('click', () => {
                const index = parseInt(btn.dataset.index);
                this.behaviors.splice(index, 1);
                EditorState.markModified();
                PonyEditor.render(EditorState.getConfig());
            });
        });

        // Обновление полей
        const updateField = (selector, field, parseAsFloat = false) => {
            container.querySelectorAll(selector).forEach(input => {
                input.addEventListener('change', () => {
                    const idx = parseInt(input.dataset.index);
                    let value = input.value;
                    if (input.type === 'checkbox') {
                        value = input.checked;
                    } else if (parseAsFloat) {
                        value = parseFloat(value) || 0;
                    }
                    this.behaviors[idx][field] = value;
                    EditorState.markModified();
                });
            });
        };

        updateField('.behavior-name', 'name');
        updateField('.behavior-chance', 'probability', true);
        updateField('.behavior-min-duration', 'min_duration', true);
        updateField('.behavior-max-duration', 'max_duration', true);
        updateField('.behavior-speed', 'speed', true);
        updateField('.behavior-sprite-right', 'sprite_right');
        updateField('.behavior-sprite-left', 'sprite_left');
        updateField('.behavior-movement', 'movement');
        updateField('.behavior-group', 'group', true);
        updateField('.behavior-skip', 'skip');
        updateField('.behavior-linked', 'linked_behavior');
    }

document.addEventListener('DOMContentLoaded', () => {
    console.log('Pony Editor initializing...');

    // Инициализация компонентов
    PonyList.init();
    PonyEditor.init();

    // Загрузка списка пони
    EditorAPI.loadPonies();

    // Кнопка сохранения
    const saveBtn = document.getElementById('btn-save');
    if (saveBtn) {
        saveBtn.addEventListener('click', () => {
            if (EditorState.currentPony && EditorState.originalConfig) {
                console.log('[Editor] Saving pony:', EditorState.currentPony);
                EditorAPI.savePony(EditorState.originalConfig);
                EditorState.modified = false;
                EditorState.updateModifiedStatus();
                showStatus(`Saved ${EditorState.currentPony}`);
            }
        });
    }

    // Кнопка закрытия
    const closeBtn = document.getElementById('btn-close');
    if (closeBtn) {
        closeBtn.addEventListener('click', () => {
            if (EditorState.hasChanges()) {
                if (confirm('Save changes before closing?')) {
                    saveBtn?.click();
                }
            }
            // Отправляем сообщение о закрытии окна
            EditorAPI.send('editor:close');
        });
    }

    // Получение сообщений от Rust
    window.editorReceive = (message) => {
        console.log('[Editor] Received from Rust:', message);
        try {
            const data = typeof message === 'string' ? JSON.parse(message) : message;
            switch (data.type) {
                case 'ponies_list':
                    console.log('[Editor] Ponies list:', data.data);
                    PonyList.updateList(data.data);
                    break;
                case 'pony_config':
                    console.log('[Editor] Pony config for:', data.pony_name);
                    EditorState.setPony(data.pony_name, data.data);
                    PonyEditor.render(data.data);
                    showStatus(`Loaded ${data.pony_name}`);
                    break;
                case 'save_success':
                    showStatus(`Saved successfully!`);
                    break;
                case 'save_error':
                    showStatus(`Error: ${data.message}`, true);
                    break;
                case 'error':
                    showStatus(`Error: ${data.message}`, true);
                    break;
                default:
                    console.log('[Editor] Unknown message type:', data.type);
            }
        } catch(e) {
            console.error('[Editor] Failed to parse message:', message, e);
        }
    };

    showStatus('Ready');
    console.log('[Editor] Initialization complete');
});</script>
