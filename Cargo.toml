# Cargo.toml
[package]
name = "desktop-ponies-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "desktop-ponies-rs"
path = "src_rust/main.rs"

[lib]
name = "desktop_ponies_lib"
path = "src_rust/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
wry = "0.50"
tao = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"
winit = "0.30"
wgpu = "0.19"
glam = "0.25"
bytemuck = { version = "1", features = ["derive"] }
image = "0.24"
pollster = "0.3"
fastrand = "2"

[target.'cfg(windows)'.dependencies]
webview2-com-sys = "0.36"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"