# Cargo.toml
[package]
name = "desktop-ponies-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "desktop-ponies-rs"
path = "src_rust/main.rs"

[lib]
name = "desktop_ponies_lib"
path = "src_rust/lib.rs"
crate-type = ["rlib"]

[dependencies]
wry = "0.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
image = "0.24"
fastrand = "2"
softbuffer = "0.4.8"
gif = "0.13.3"
color_quant = "1.1"
rust-embed = "8.11.0"
base64 = "0.22.1"
urlencoding = "2.1.3"
ureq = { version = "2", features = ["json"] }
fontdue = "0.9.4"
rodio = { version = "0.19", default-features = false, features = ["mp3", "vorbis", "wav"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_System_Registry"] }
