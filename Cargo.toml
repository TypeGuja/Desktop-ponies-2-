# Cargo.toml
[package]
name = "desktop-ponies-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "desktop-ponies-rs"
path = "src_rust/main.rs"

[lib]
name = "desktop_ponies_lib"
path = "src_rust/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
wry = "0.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
wgpu = "0.19"
glam = "0.25"
image = "0.24"
fastrand = "2"
softbuffer = "0.4.8"
rfd = "0.14"
directories = "5.0"